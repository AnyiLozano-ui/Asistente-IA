<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MagiMente</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <section id="menu" class="screen active home-screen">
            <div class="top-decoration">
                <img src="./assets/nube.png" class="cloud-img" />

                <div class="profile">
                    <img src="./assets/personaje.png" class="brain-img" />
                </div>
            </div>

            <header class="main-header">
                <h1 class="titulo-magico">
                    <span class="letra1">M</span>
                    <span class="letra2">u</span>
                    <span class="letra3">n</span>
                    <span class="letra4">d</span>
                    <span class="letra5">o</span>

                    <br />

                    <span class="letra6">M</span>
                    <span class="letra7">á</span>
                    <span class="letra8">g</span>
                    <span class="letra9">i</span>
                    <span class="letra10">c</span>
                    <span class="letra11">o</span>
                </h1>

                <p>
                    Una compañera con IA que ayuda a los niños a aprender con diversión, confianza y alegría 💜
                </p>
            </header>

            <div class="cards">
                <button class="card pink" onclick="abrirActividad('pronunciacion', 'pink')">
						<img
							src="./assets/bocina.png"
							class="card-image" />

						<h2>Pronunciación</h2>

						<p>Palabras y sílabas</p>
					</button>

                <button class="card blue" onclick="abrirActividad('silabas', 'blue')">
						<img src="./assets/silabas.png" class="card-image" />

						<h2>Sílabas</h2>

						<p>Da, ba, tra, bra</p>
					</button>

                <button class="card purple" onclick="abrirActividad('tablas', 'purple')">
						<img src="./assets/tabalas.png" class="card-image" />

						<h2>Tablas</h2>

						<p>Multiplicación</p>
					</button>

                <button class="card green" onclick="abrirActividad('matematicas', 'green')">
						<img
							src="./assets/mate.png"
							class="card-image" />

						<h2>Matemáticas</h2>

						<p>Sumas y restas</p>
					</button>

                <button class="card yellow" onclick="abrirMenuJuegos()">
						<img src="./assets/juegos.png" class="card-image" />

						<h2>Juegos</h2>

						<p>Descrúbrelos</p>
					</button>

                <button class="card orange" onclick="descargarMaterial()">
						<img src="./assets/archivos.png" class="card-image" />

						<h2>Material</h2>

						<p>Descargable</p>
					</button>
            </div>
        </section>


    </main>

    <script src="script.js"></script>
</body>

</html>
