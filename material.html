<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Descargable - MagiMente</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <section id="material" class="screen activity-screen active">
            <button class="back" onclick="window.close()">⬅ Volver</button>

            <div class="material-container">
                <h2>📚 Material Descargable</h2>
                <p class="material-subtitle">Descarga recursos educativos para continuar aprendiendo</p>

                <div class="material-lista">
                    <a href="https://example.com/guia-palabras.pdf" target="_blank" class="material-item">
                        <div class="material-info">
                            <div class="material-icon-large">🪄</div>
                            <div class="material-texto">
                                <h3>Palabras Mágicas</h3>
                                <p>Material educativo digital y listo para imprimir ✨</p>
                                <span class="material-tipo">PDF • 2.4 MB</span>
                            </div>
                        </div>
                        <div class="material-btn-grande">⬇️ Descargar Material</div>
                    </a>
                </div>

                <div class="mascota-container">
                    <img src="./assets/unicornio.png" alt="MagiMente" class="mascota-flotante">
                </div>
            </div>
        </section>


    </main>

    <script src="script.js"></script>
</body>

</html>
